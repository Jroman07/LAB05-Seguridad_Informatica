name: Desplegar chat en Render

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Pruebas unitarias e integracion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v6
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias de desarrollo
        run: npm ci --include=dev
      - name: Ejecutar pruebas unitarias
        run: npm test
      - name: Ejecutar pruebas de integracion
        run: npm run test:integration

  deploy:
    name: Desplegar en Render
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Solicitar despliegue
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --get --data-urlencode "ref=${GITHUB_SHA}" \
            "$RENDER_DEPLOY_HOOK_URL"
