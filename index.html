<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNA Chat Laboratorio 05</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px Arial,sans-serif;color:#182c39;background:#f4f7f9}
header{background:#164963;color:white;padding:20px 28px}h1{margin:0 0 8px;font-size:25px}
main{max-width:1000px;margin:auto;padding:24px 24px 160px}#messages{list-style:none;padding:0}
li{padding:16px;background:white;border-radius:6px;margin:12px 0;overflow-wrap:anywhere}
img,video,iframe{display:block;max-width:100%;width:480px;max-height:300px;margin-top:12px;border:0}
form{position:fixed;bottom:0;background:white;border-top:1px solid #ccd8df;width:100%;padding:16px;display:flex;gap:12px}
label{font-size:13px;display:flex;flex-direction:column;gap:5px}label:first-child{width:20%}label:nth-child(2){flex:1}
input,button{font:16px Arial;padding:12px;border:1px solid #9cabb5;border-radius:4px}button{background:#164963;color:white;align-self:end}
#error{color:#a91d27;min-height:24px}#connection{font-size:14px}
</style>
</head>
<body>
<header><h1>UNA Chat Laboratorio 05</h1><p>Texto seguro, imágenes y videos por URL HTTP o HTTPS</p><span id="connection">Conectando</span></header>
<main><div id="error" role="alert"></div><ul id="messages" aria-label="Mensajes"></ul></main>
<form><label>Nombre<input id="nombre" maxlength="80" autocomplete="off" value="José"></label><label>Mensaje<input id="m" maxlength="2000" autocomplete="off" required placeholder="Escriba un mensaje o URL de imagen o video"></label><button>Enviar</button></form>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const error = document.querySelector('#error');
socket.on('connect', () => document.querySelector('#connection').textContent = 'Conectado al backend');
socket.on('disconnect', () => document.querySelector('#connection').textContent = 'Desconectado');
document.querySelector('form').addEventListener('submit', event => {
  event.preventDefault(); error.textContent = '';
  socket.emit('Evento-Mensaje-Server', JSON.stringify({nombre: document.querySelector('#nombre').value,
    mensaje: document.querySelector('#m').value, color:'#245b78'}));
  document.querySelector('#m').value = '';
});
socket.on('Mensaje-Rechazado', result => error.textContent = 'Mensaje rechazado: ' + result.error);
socket.on('Evento-Mensaje-Server', raw => {
  const msg = JSON.parse(raw);
  const li = document.createElement('li');
  const name = document.createElement('b'); name.textContent = msg.nombre + ': '; name.style.color = msg.color;
  li.append(name, document.createTextNode(msg.mensaje));
  if (msg.tipo === 'image' || msg.tipo === 'video') {
    const media = document.createElement(msg.tipo === 'image' ? 'img' : 'video');
    media.src = msg.mensaje;
    if (msg.tipo === 'image') media.alt = 'Imagen enviada en el chat';
    else {media.controls = true; media.preload = 'auto';}
    li.append(media);
  } else if (msg.tipo === 'youtube' && /^[\w-]{11}$/.test(msg.videoId)) {
    const frame = document.createElement('iframe'); frame.title = 'Video de YouTube';
    frame.src = 'https://www.youtube-nocookie.com/embed/' + msg.videoId;
    frame.allowFullscreen = true; frame.height = '270'; li.append(frame);
  }
  document.querySelector('#messages').append(li); li.scrollIntoView();
});
</script>
</body>
</html>
